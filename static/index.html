<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    h1 { font-size: 1.4rem; margin-bottom: 24px; color: #1a1a1a; }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus { border-color: #185fa5; }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-add  { background: #185fa5; color: white; }
    .btn-add:hover { background: #144e8a; }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
    }

    .task input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; flex-shrink: 0; }

    .task-title {
      flex: 1;
      font-size: 0.95rem;
      color: #1a1a1a;
    }

    .task-title.done {
      text-decoration: line-through;
      color: #aaa;
    }

    .edit-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #185fa5;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-edit {
      background: none;
      color: #185fa5;
      font-size: 1rem;
      padding: 2px 6px;
    }

    .btn-save {
      background: #185fa5;
      color: white;
      font-size: 0.8rem;
      padding: 4px 10px;
    }

    .btn-cancel {
      background: #eee;
      color: #444;
      font-size: 0.8rem;
      padding: 4px 10px;
    }

    .btn-delete {
      background: none;
      color: #cc3333;
      font-size: 1rem;
      padding: 2px 6px;
    }

    .empty {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button class="btn-add" onclick="addTask()">Add</button>
    </div>

    <div class="task-list" id="taskList"></div>
  </div>

  <script>
    const API = '/tasks';

    async function loadTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      const list = document.getElementById('taskList');

      if (tasks.length === 0) {
        list.innerHTML = '<p class="empty">No tasks yet. Add one above.</p>';
        return;
      }

      list.innerHTML = tasks.map(t => renderTask(t)).join('');
    }

    function renderTask(t) {
      return `
        <div class="task" id="task-${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''}
            onchange="toggleTask(${t.id}, '${escapeQuotes(t.title)}', this.checked)" />
          <span class="task-title ${t.done ? 'done' : ''}">${t.title}</span>
          <button class="btn-edit" onclick="startEdit(${t.id}, '${escapeQuotes(t.title)}', ${t.done})">✏️</button>
          <button class="btn-delete" onclick="deleteTask(${t.id})">✕</button>
        </div>
      `;
    }

    function renderEditMode(t_id, title, done) {
      return `
        <div class="task" id="task-${t_id}">
          <input type="checkbox" ${done ? 'checked' : ''}
            onchange="toggleTask(${t_id}, '${escapeQuotes(title)}', this.checked)" />
          <input class="edit-input" id="edit-input-${t_id}" value="${title}" />
          <button class="btn-save"   onclick="saveEdit(${t_id}, ${done})">Save</button>
          <button class="btn-cancel" onclick="loadTasks()">Cancel</button>
        </div>
      `;
    }

    function startEdit(id, title, done) {
      const taskEl = document.getElementById(`task-${id}`);
      taskEl.outerHTML = renderEditMode(id, title, done);
      document.getElementById(`edit-input-${id}`).focus();
    }

    async function saveEdit(id, done) {
      const input = document.getElementById(`edit-input-${id}`);
      const newTitle = input.value.trim();
      if (!newTitle) return;

      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle, done })
      });

      loadTasks();
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;

      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });

      input.value = '';
      loadTasks();
    }

    async function toggleTask(id, title, done) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, done })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'");
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('taskInput')
        .addEventListener('keydown', e => {
          if (e.key === 'Enter') addTask();
        });
      loadTasks();
    });
  </script>
</body>
</html>
