[package]
name = "TaskManager_RESTAPI"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["http2", "macros", "ws"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.52.2", features = ["full"] }
